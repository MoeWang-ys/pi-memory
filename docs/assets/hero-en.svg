<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="使用前 vs 使用后：AI 从每次失忆变成记得你">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F2EBDE"/>
    </linearGradient>
    <linearGradient id="warmG" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#C04A1A"/><stop offset="100%" stop-color="#DC8250"/>
    </linearGradient>
    <linearGradient id="tealG" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#1F4E4A"/><stop offset="100%" stop-color="#35857A"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5A4632" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5A4632" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <!-- 标题区 -->
  <text x="600" y="62" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="34" font-weight="800" fill="#2B2118">The same sentence, two different experiences</text>
  <text x="600" y="94" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="15" fill="#8A7A66">Does it actually remember what you told it?</text>

  <!-- ============ 左：BEFORE ============ -->
  <g transform="translate(52,128)">
    <rect x="0" y="0" width="524" height="440" rx="20" fill="#FFFFFF" opacity="0.55" stroke="#B9A992" stroke-opacity="0.5" stroke-dasharray="7 5"/>
    <g transform="translate(26,26)">
      <rect x="0" y="0" width="112" height="32" rx="16" fill="#8A7A66" opacity="0.16"/>
      <text x="56" y="21" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif"
            font-size="13.5" font-weight="800" fill="#7A6B58" letter-spacing="1.4">BEFORE</text>
    </g>
    <text x="26" y="90" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="19" font-weight="800" fill="#4A3B2C">Every new session, it's a stranger again</text>

    <!-- 对话 1 -->
    <g transform="translate(26,116)">
      <rect x="0" y="0" width="470" height="74" rx="13" fill="#F4F1EA"/>
      <circle cx="26" cy="24" r="14" fill="#B9A992" opacity="0.42"/>
      <text x="26" y="29" text-anchor="middle" font-size="12" font-family="ui-sans-serif,sans-serif"
            font-weight="700" fill="#FFFFFF">你</text>
      <text x="50" y="29" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="14.5" fill="#3E3226">Answer me in Chinese from now on.</text>
      <text x="50" y="54" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13" fill="#9A8A76">(it complies)</text>
    </g>

    <!-- 分隔：会话结束 -->
    <g transform="translate(26,206)">
      <path d="M0 0 H 470" stroke="#B9A992" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.75"/>
      <circle cx="235" cy="0" r="16" fill="#FBF8F2"/>
      <text x="235" y="5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif"
            font-size="11.5" font-weight="700" fill="#A89880">session ends</text>
    </g>

    <!-- 对话 2 -->
    <g transform="translate(26,238)">
      <rect x="0" y="0" width="470" height="98" rx="13" fill="#F4F1EA"/>
      <circle cx="26" cy="24" r="14" fill="#B9A992" opacity="0.42"/>
      <text x="26" y="29" text-anchor="middle" font-size="12" font-family="ui-sans-serif,sans-serif"
            font-weight="700" fill="#FFFFFF">你</text>
      <text x="50" y="29" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="14.5" fill="#3E3226">Write me a README.</text>
      <text x="50" y="58" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13" fill="#9A8A76">(it replies in English... forgot again)</text>
      <text x="50" y="82" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12.5" fill="#B08A6A">← you have to repeat yourself</text>
    </g>

    <!-- 底部小结 -->
    <text x="26" y="382" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="12.5" fill="#8A7A66">Same things, said again · Context, explained again · Preferences, corrected again</text>
  </g>

  <!-- ============ VS 分隔 ============ -->
  <g transform="translate(600,340)">
    <circle cx="0" cy="0" r="30" fill="#FBF8F2" stroke="#E0D5C4" stroke-width="1.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif"
          font-size="17" font-weight="800" fill="#A89880">VS</text>
  </g>

  <!-- ============ 右：AFTER ============ -->
  <g transform="translate(624,128)">
    <rect x="0" y="0" width="524" height="440" rx="20" fill="#FFFFFF" opacity="0.9" stroke="#C04A1A" stroke-opacity="0.3"/>
    <g transform="translate(26,26)">
      <rect x="0" y="0" width="104" height="32" rx="16" fill="url(#warmG)"/>
      <text x="52" y="21" text-anchor="middle" font-family="ui-sans-serif,-apple-system,sans-serif"
            font-size="13.5" font-weight="800" fill="#FFFFFF" letter-spacing="1.4">AFTER</text>
    </g>
    <text x="26" y="90" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="19" font-weight="800" fill="#2B2118">It remembers you, all the way through</text>

    <!-- 对话 1（同左） -->
    <g transform="translate(26,116)">
      <rect x="0" y="0" width="470" height="74" rx="13" fill="#FDF9F5" stroke="#C04A1A" stroke-opacity="0.14"/>
      <circle cx="26" cy="24" r="14" fill="url(#warmG)" opacity="0.85"/>
      <text x="26" y="29" text-anchor="middle" font-size="12" font-family="ui-sans-serif,sans-serif"
            font-weight="700" fill="#FFFFFF">你</text>
      <text x="50" y="29" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="14.5" fill="#3E3226">Answer me in Chinese from now on.</text>
      <!-- 抽取提示 -->
      <g transform="translate(50,44)">
        <circle cx="6" cy="6" r="3.5" fill="#2E7A72" opacity="0.75"/>
        <text x="17" y="10" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
              font-size="11.5" fill="#2E7A72">Quietly remembered (you did nothing)</text>
      </g>
    </g>

    <!-- 记忆卡片（浮出） -->
    <g transform="translate(46,198)">
      <rect x="0" y="0" width="430" height="46" rx="11" fill="#C04A1A" opacity="0.11"/>
      <rect x="0" y="0" width="4.5" height="46" rx="2.25" fill="url(#warmG)"/>
      <text x="18" y="20" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="10.5" font-weight="800" fill="#8E3E1C" letter-spacing="0.9">PREFERENCE</text>
      <text x="18" y="37" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13.5" fill="#3E3226">User prefers replies in Chinese</text>
    </g>

    <!-- 分隔 -->
    <g transform="translate(26,258)">
      <path d="M0 0 H 470" stroke="#E0D5C4" stroke-width="1.2" stroke-dasharray="5 5"/>
      <circle cx="235" cy="0" r="16" fill="#FFFFFF"/>
      <text x="235" y="5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif"
            font-size="11.5" font-weight="700" fill="#B08A6A">Three days later · new session</text>
    </g>

    <!-- 对话 2 -->
    <g transform="translate(26,290)">
      <rect x="0" y="0" width="470" height="98" rx="13" fill="#FDF9F5" stroke="#C04A1A" stroke-opacity="0.14"/>
      <circle cx="26" cy="24" r="14" fill="url(#warmG)" opacity="0.85"/>
      <text x="26" y="29" text-anchor="middle" font-size="12" font-family="ui-sans-serif,sans-serif"
            font-weight="700" fill="#FFFFFF">你</text>
      <text x="50" y="29" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="14.5" fill="#3E3226">Write me a README.</text>
      <g transform="translate(50,44)">
        <circle cx="6" cy="6" r="3.5" fill="#1F4E4A" opacity="0.8"/>
        <text x="17" y="10" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
              font-size="11.5" fill="#1F4E4A">Recalls you wanted Chinese, writes in Chinese</text>
      </g>
      <text x="50" y="82" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12.5" font-weight="700" fill="#C04A1A">← not one word repeated</text>
    </g>
  </g>
</svg>
