<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="记忆的写入与读取流程">
  <defs>
    <linearGradient id="paper3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F2EBDE"/>
    </linearGradient>
    <linearGradient id="terraW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C04A1A"/><stop offset="100%" stop-color="#DC8250"/>
    </linearGradient>
    <linearGradient id="tealR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F4E4A"/><stop offset="100%" stop-color="#35857A"/>
    </linearGradient>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C04A1A"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F4E4A"/>
    </marker>
    <filter id="sh3" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#5A4632" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#5A4632" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="url(#paper3)"/>
  <rect width="1200" height="560" fill="url(#grid3)"/>

  <!-- 标题 -->
  <text x="600" y="46" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="25" font-weight="800" fill="#2B2118">记忆是怎么流动的</text>
  <text x="600" y="72" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="14" fill="#8A7A66">写的时候存进去，读的时候语义找出最近的几条</text>

  <!-- ==================== 写入链路（上） ==================== -->
  <g transform="translate(0,104)">
    <g transform="translate(48,0)">
      <rect x="0" y="0" width="92" height="30" rx="15" fill="url(#terraW)" opacity="0.14"/>
      <text x="46" y="20" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif"
            font-size="13" font-weight="800" fill="#8E3E1C">写入</text>
    </g>
    <text x="156" y="20" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#A08C74">每轮对话后，后台自动跑，你什么都不用做</text>

    <!-- 三个步骤 -->
    <g font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" filter="url(#sh3)">
      <rect x="60" y="42" width="300" height="106" rx="15" fill="#FFFFFF" stroke="#C04A1A" stroke-opacity="0.22"/>
      <text x="82" y="72" font-size="15.5" font-weight="700" fill="#8E3E1C">抽取</text>
      <text x="82" y="98" font-size="12.8" fill="#6B5A47">把对话交给模型：</text>
      <text x="82" y="118" font-size="12.8" fill="#6B5A47">「有什么值得记住？」</text>
      <text x="82" y="138" font-size="11.5" fill="#9A8A76">输出结构化条目 + 分类</text>

      <rect x="450" y="42" width="300" height="106" rx="15" fill="#FFFFFF" stroke="#C04A1A" stroke-opacity="0.22"/>
      <text x="472" y="72" font-size="15.5" font-weight="700" fill="#8E3E1C">向量化</text>
      <text x="472" y="98" font-size="12.8" fill="#6B5A47">文字变成 1024 个数字</text>
      <text x="472" y="118" font-size="12.8" fill="#6B5A47">= 语义空间里的一个坐标</text>
      <text x="472" y="138" font-size="11.5" fill="#9A8A76">意思相近 → 坐标也相近</text>

      <rect x="840" y="42" width="300" height="106" rx="15" fill="#FFFFFF" stroke="#C04A1A" stroke-opacity="0.22"/>
      <text x="862" y="72" font-size="15.5" font-weight="700" fill="#8E3E1C">去重 + 存</text>
      <text x="862" y="98" font-size="12.8" fill="#6B5A47">相似度 ≥ 0.95 视为重复</text>
      <text x="862" y="118" font-size="12.8" fill="#6B5A47">同一件事不存两遍</text>
      <text x="862" y="138" font-size="11.5" fill="#9A8A76">落进 SQLite</text>
    </g>

    <!-- 箭头 -->
    <g stroke="#C04A1A" stroke-width="2" opacity="0.6" marker-end="url(#aT)">
      <path d="M364 95 H 444"/>
      <path d="M754 95 H 834"/>
    </g>
  </g>

  <!-- ==================== 中间：数据库 ==================== -->
  <g transform="translate(0,290)">
    <g filter="url(#sh3)">
      <rect x="440" y="0" width="320" height="70" rx="16" fill="#2B2118" opacity="0.06" stroke="#5A4632" stroke-opacity="0.25"/>
      <ellipse cx="470" cy="35" rx="13" ry="22" fill="#8A6A4E" opacity="0.35"/>
      <ellipse cx="470" cy="35" rx="26" ry="22" fill="#9A7A5E" opacity="0.30"/>
      <text x="520" y="30" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15.5" font-weight="700" fill="#2B2118">SQLite 向量库</text>
      <text x="520" y="52" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12.5" fill="#8A7A66">387 条记忆 · 全在你自己机器上</text>
    </g>
  </g>

  <!-- 下行箭头（写：从上到下） -->
  <path d="M930 252 V 300 H 770" stroke="#C04A1A" stroke-width="2" fill="none" marker-end="url(#aT)" opacity="0.55"/>
  <!-- 上行箭头（读：从下到上） -->
  <path d="M430 300 V 252 H 270" stroke="#1F4E4A" stroke-width="2" fill="none" marker-end="url(#aG)" opacity="0.55"/>

  <!-- ==================== 读取链路（下） ==================== -->
  <g transform="translate(0,384)">
    <g transform="translate(48,0)">
      <rect x="0" y="0" width="92" height="30" rx="15" fill="url(#tealR)" opacity="0.14"/>
      <text x="46" y="20" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif"
            font-size="13" font-weight="800" fill="#1F4E4A">读取</text>
    </g>
    <text x="156" y="20" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" fill="#A08C74">你开口的那一刻，自动把相关记忆塞进上下文</text>

    <g font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" filter="url(#sh3)">
      <rect x="60" y="42" width="300" height="106" rx="15" fill="#FFFFFF" stroke="#1F4E4A" stroke-opacity="0.24"/>
      <text x="82" y="72" font-size="15.5" font-weight="700" fill="#1F4E4A">检索</text>
      <text x="82" y="98" font-size="12.8" fill="#6B5A47">拿你当前的问题当 query</text>
      <text x="82" y="118" font-size="12.8" fill="#6B5A47">同样变成向量</text>
      <text x="82" y="138" font-size="11.5" fill="#9A8A76">找坐标最近的几条</text>

      <rect x="450" y="42" width="300" height="106" rx="15" fill="#FFFFFF" stroke="#1F4E4A" stroke-opacity="0.24"/>
      <text x="472" y="72" font-size="15.5" font-weight="700" fill="#1F4E4A">排序过滤</text>
      <text x="472" y="98" font-size="12.8" fill="#6B5A47">低于阈值的直接丢掉</text>
      <text x="472" y="118" font-size="12.8" fill="#6B5A47">在相似度断崖处截断</text>
      <text x="472" y="138" font-size="11.5" fill="#9A8A76">宁可少给，也别塞垃圾</text>

      <rect x="840" y="42" width="300" height="106" rx="15" fill="#FFFFFF" stroke="#1F4E4A" stroke-opacity="0.24"/>
      <text x="862" y="72" font-size="15.5" font-weight="700" fill="#1F4E4A">注入</text>
      <text x="862" y="98" font-size="12.8" fill="#6B5A47">把命中的记忆</text>
      <text x="862" y="118" font-size="12.8" fill="#6B5A47">拼进这轮上下文</text>
      <text x="862" y="138" font-size="11.5" fill="#9A8A76">AI 于是「想起来了」</text>
    </g>

    <g stroke="#1F4E4A" stroke-width="2" opacity="0.6" marker-end="url(#aG)">
      <path d="M364 95 H 444"/>
      <path d="M754 95 H 834"/>
    </g>
  </g>

  <!-- 底部注解 -->
  <text x="600" y="546" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="12.5" fill="#A08C74">
    你问「怎么让它别老崩」，记忆里存的是「服务稳定性加固」——一个词都对不上，但意思是一回事。向量能抓住这个。
  </text>
</svg>
