<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="记忆的工作原理：说一次，以后都记得">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F2EBDE"/>
    </linearGradient>
    <linearGradient id="terra3" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#C04A1A"/><stop offset="100%" stop-color="#DC8250"/>
    </linearGradient>
    <linearGradient id="teal3" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#1F4E4A"/><stop offset="100%" stop-color="#35857A"/>
    </linearGradient>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C08A6A"/>
    </marker>
    <filter id="sh3" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5A4632" flood-opacity="0.11"/>
    </filter>
    <pattern id="gr3" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5A4632" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#bg3)"/>
  <rect width="1200" height="480" fill="url(#gr3)"/>

  <text x="600" y="52" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="26" font-weight="800" fill="#2B2118">说一次，以后都记得</text>
  <text x="600" y="80" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="14.5" fill="#8A7A66">你只管正常聊天。记什么、什么时候想起来，它自己处理</text>

  <!-- ============ 上：写 ============ -->
  <g transform="translate(0,108)">
    <g transform="translate(46,0)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="url(#terra3)" opacity="0.14"/>
      <text x="75" y="20" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13" font-weight="800" fill="#8E3E1C">你说话的时候</text>
    </g>

    <g filter="url(#sh3)">
      <rect x="46" y="42" width="330" height="86" rx="16" fill="#FFFFFF" stroke="#C04A1A" stroke-opacity="0.2"/>
      <text x="70" y="74" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15.5" font-weight="700" fill="#2B2118">「以后回答我都用中文」</text>
      <text x="70" y="100" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13" fill="#8A7A66">你随口一说，照常继续聊</text>
      <text x="70" y="119" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12" fill="#B08A6A">不用打标签，不用点保存</text>
    </g>

    <path d="M386 85 H 442" stroke="#C08A6A" stroke-width="2" marker-end="url(#a3)" opacity="0.8"/>

    <g filter="url(#sh3)">
      <rect x="452" y="42" width="330" height="86" rx="16" fill="#FFFFFF" stroke="#C04A1A" stroke-opacity="0.2"/>
      <text x="476" y="74" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15.5" font-weight="700" fill="#2B2118">它悄悄挑出值得记的</text>
      <text x="476" y="100" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13" fill="#8A7A66">闲聊不记，偏好和决定才记</text>
      <text x="476" y="119" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12" fill="#B08A6A">全程后台，不打断你</text>
    </g>

    <path d="M792 85 H 848" stroke="#C08A6A" stroke-width="2" marker-end="url(#a3)" opacity="0.8"/>

    <g filter="url(#sh3)">
      <rect x="858" y="42" width="296" height="86" rx="16" fill="#FFFFFF" stroke="#C04A1A" stroke-opacity="0.2"/>
      <text x="882" y="74" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15.5" font-weight="700" fill="#2B2118">存成一条记忆</text>
      <text x="882" y="100" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13" fill="#8A7A66">意思相近的不会存两遍</text>
      <text x="882" y="119" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12" fill="#B08A6A">存在你自己电脑上</text>
    </g>
  </g>

  <!-- 中间：记忆卡片 -->
  <g transform="translate(0,268)">
    <g filter="url(#sh3)">
      <rect x="300" y="0" width="600" height="78" rx="17" fill="#FFFFFF" stroke="#E0D5C4"/>
      <rect x="300" y="0" width="5" height="78" rx="2.5" fill="url(#terra3)"/>
      <text x="330" y="30" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12" font-weight="800" fill="#8E3E1C" letter-spacing="1">偏好</text>
      <text x="330" y="54" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15.5" fill="#3E3226">用户偏好用中文回答</text>
      <text x="330" y="72" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="11.5" fill="#A89880">+ 你所有的偏好、背景、决定、经验，一共几百条</text>
      <circle cx="860" cy="39" r="22" fill="url(#teal3)" opacity="0.12"/>
      <text x="860" y="44" text-anchor="middle" font-size="18" fill="#1F4E4A">🔒</text>
    </g>
  </g>

  <!-- ============ 下：读 ============ -->
  <g transform="translate(0,376)">
    <g transform="translate(46,0)">
      <rect x="0" y="0" width="176" height="30" rx="15" fill="url(#teal3)" opacity="0.15"/>
      <text x="88" y="20" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="13" font-weight="800" fill="#1F4E4A">换个会话，你开口</text>
    </g>

    <g filter="url(#sh3)">
      <rect x="46" y="42" width="330" height="60" rx="15" fill="#FFFFFF" stroke="#1F4E4A" stroke-opacity="0.22"/>
      <text x="70" y="68" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="14.5" fill="#3E3226">「帮我写个 README」</text>
      <text x="70" y="89" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12" fill="#A89880">你没提中文这回事</text>
    </g>

    <path d="M386 72 H 442" stroke="#7FA8A0" stroke-width="2" marker-end="url(#a3)" opacity="0.85"/>

    <g filter="url(#sh3)">
      <rect x="452" y="42" width="330" height="60" rx="15" fill="#FFFFFF" stroke="#1F4E4A" stroke-opacity="0.22"/>
      <text x="476" y="68" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="14.5" font-weight="700" fill="#1F4E4A">它自己想起了那几条</text>
      <text x="476" y="89" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12" fill="#A89880">意思对得上就捞出来，不看关键词</text>
    </g>

    <path d="M792 72 H 848" stroke="#7FA8A0" stroke-width="2" marker-end="url(#a3)" opacity="0.85"/>

    <g filter="url(#sh3)">
      <rect x="858" y="42" width="296" height="60" rx="15" fill="#1F4E4A" opacity="0.10" stroke="#1F4E4A" stroke-opacity="0.26"/>
      <text x="882" y="68" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="14.5" font-weight="700" fill="#1F4E4A">直接用中文给你写</text>
      <text x="882" y="89" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12" fill="#5A7A74">你一个字都没重复说</text>
    </g>
  </g>
</svg>
