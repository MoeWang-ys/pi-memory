<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="记忆中心由哪几块组成">
  <defs>
    <linearGradient id="bga" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FBF8F2"/><stop offset="100%" stop-color="#F2EBDE"/>
    </linearGradient>
    <linearGradient id="ta" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#C04A1A"/><stop offset="100%" stop-color="#DC8250"/>
    </linearGradient>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#C08A6A"/>
    </marker>
    <filter id="sha" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5A4632" flood-opacity="0.11"/>
    </filter>
    <pattern id="gra" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5A4632" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="url(#bga)"/>
  <rect width="1200" height="560" fill="url(#gra)"/>

  <text x="600" y="50" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="26" font-weight="800" fill="#2B2118">它由哪几块组成</text>
  <text x="600" y="78" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="14.5" fill="#8A7A66">你只需要装中间那个。两边的是可选的</text>

  <!-- ===== 顶部：你的 AI 工具 ===== -->
  <g transform="translate(0,110)">
    <g filter="url(#sha)">
      <rect x="330" y="0" width="540" height="64" rx="16" fill="#FFFFFF" stroke="#E0D5C4"/>
      <text x="600" y="27" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15" font-weight="700" fill="#2B2118">你平时用的 AI 工具</text>
      <text x="600" y="48" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12.5" fill="#A89880">pi CLI 扩展 · PI-Desktop 插件（二选一，装完就接线）</text>
    </g>
  </g>

  <path d="M600 174 V 206" stroke="#C08A6A" stroke-width="2" marker-end="url(#aa)" opacity="0.8"/>
  <text x="618" y="196" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="11.5" fill="#B08A6A">它俩只在中间传话</text>

  <!-- ===== 中间：记忆中心本体 ===== -->
  <g transform="translate(0,216)">
    <rect x="120" y="0" width="960" height="164" rx="20" fill="#FFFFFF" opacity="0.75" stroke="#C04A1A" stroke-opacity="0.24" filter="url(#sha)"/>

    <g transform="translate(146,20)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="url(#ta)" opacity="0.13"/>
      <text x="56" y="19" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC',sans-serif"
            font-size="12.5" font-weight="800" fill="#8E3E1C">记忆中心</text>
      <text x="126" y="19" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12.5" fill="#A89880">← 你只需要装这个</text>
    </g>

    <g font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
      <g transform="translate(150,64)">
        <rect x="0" y="0" width="212" height="76" rx="13" fill="#C04A1A" opacity="0.09"/>
        <text x="20" y="30" font-size="15" font-weight="700" fill="#8E3E1C">记住</text>
        <text x="20" y="52" font-size="12.5" fill="#7A6B58">从对话里挑出值得留的</text>
        <text x="20" y="69" font-size="11.5" fill="#A89880">闲聊不记，偏好才记</text>
      </g>
      <g transform="translate(382,64)">
        <rect x="0" y="0" width="212" height="76" rx="13" fill="#C04A1A" opacity="0.09"/>
        <text x="20" y="30" font-size="15" font-weight="700" fill="#8E3E1C">想起来</text>
        <text x="20" y="52" font-size="12.5" fill="#7A6B58">按意思找，不按关键词</text>
        <text x="20" y="69" font-size="11.5" fill="#A89880">意思对得上就捞出来</text>
      </g>
      <g transform="translate(614,64)">
        <rect x="0" y="0" width="212" height="76" rx="13" fill="#C04A1A" opacity="0.09"/>
        <text x="20" y="30" font-size="15" font-weight="700" fill="#8E3E1C">存着</text>
        <text x="20" y="52" font-size="12.5" fill="#7A6B58">全在你自己电脑上</text>
        <text x="20" y="69" font-size="11.5" fill="#A89880">重复的不存第二遍</text>
      </g>
      <g transform="translate(846,64)">
        <rect x="0" y="0" width="212" height="76" rx="13" fill="#1F4E4A" opacity="0.10"/>
        <text x="20" y="30" font-size="15" font-weight="700" fill="#1F4E4A">自己活着</text>
        <text x="20" y="52" font-size="12.5" fill="#5A7A74">模型掉了自动拉起</text>
        <text x="20" y="69" font-size="11.5" fill="#7A9A94">服务挂了自动重启</text>
      </g>
    </g>
  </g>

  <path d="M600 380 V 412" stroke="#C08A6A" stroke-width="2" marker-end="url(#aa)" opacity="0.8"/>
  <text x="618" y="402" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="11.5" fill="#B08A6A">借用「大脑」来干活</text>

  <!-- ===== 底部：两种大脑，任选 ===== -->
  <g transform="translate(0,422)">
    <g filter="url(#sha)">
      <rect x="200" y="0" width="370" height="88" rx="16" fill="#FFFFFF" stroke="#1F4E4A" stroke-opacity="0.26"/>
      <text x="224" y="30" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15.5" font-weight="700" fill="#1F4E4A">用你电脑上的模型</text>
      <text x="224" y="54" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12.5" fill="#7A6B58">免费 · 一个字都不外传</text>
      <text x="224" y="74" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="11.5" fill="#A89880">LM Studio / Ollama</text>
    </g>
    <g filter="url(#sha)">
      <rect x="630" y="0" width="370" height="88" rx="16" fill="#FFFFFF" stroke="#C04A1A" stroke-opacity="0.26"/>
      <text x="654" y="30" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="15.5" font-weight="700" fill="#8E3E1C">或租别人的模型</text>
      <text x="654" y="54" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="12.5" fill="#7A6B58">便宜 · 机器差也能跑</text>
      <text x="654" y="74" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
            font-size="11.5" fill="#A89880">硅基流动 / DeepSeek / OpenAI</text>
    </g>
    <text x="600" y="80" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="13" font-weight="700" fill="#B08A6A">改一行配置就能换</text>
  </g>
</svg>
